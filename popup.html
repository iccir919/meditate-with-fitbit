<!DOCTYPE html>
<html>
    <head>
        <title>Meditate with Fibit</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="wrapper">
            <div id="sign-in">
                <h1>Meditate with Fitbit</h1>
                <button id="connectBtn">Connect Fitbit</button>
            </div>

            <div id="dashboard">
                <header>
                    <h1>Meditate with Fitbit</h1>
                    <button id="logoutBtn">Logout</button>
                </header>

                <div class="session-controls">
                    <button id="start-button">Start Session</button>
                    <button id="end-button">End Session</button>
                </div>
            </div>

            <div id="status">Checking connection...</div>

        </div>
        <script src="popup.js"></script>
    </body>
</html>
